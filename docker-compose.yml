services:
  mysql:
    image: mysql:8.4
    container_name: mysql-dba-portfolio
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: portfolio_root
      MYSQL_DATABASE: GameOps
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio_pw
    ports:
      - "33067:3306"
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
      - --performance-schema=ON
      - --innodb_flush_log_at_trx_commit=1
      - --sync-binlog=1
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  mysql_data:
